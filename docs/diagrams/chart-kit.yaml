# yaml-language-server: $schema=https://raw.githubusercontent.com/Sagargupta16/orrery/main/skills/orrery/references/diagram.schema.json
# Chart kit composition, planned from the code on 2026-10-22 (branch feat/chart-motion).
# Evidence paths are relative to the repo root; every edge is a real render (<X ... />) or call.
#
# leftOut (put back on request):
# - Callers of the Standard* wrappers (MonthlyFlowChart, CohortSpendingAnalysis, the FIRE calculator panels,
#   DayOfWeekChart, FinancialHealthScore, CFPScoreView and other pages): one hop further out; MonthlyFlowChart
#   renders StandardBarChart (components/analytics/MonthlyFlowChart.tsx:81).
# - CashFlowForecast panel: it only renders CashFlowForecastChart (components/analytics/CashFlowForecast.tsx:71).
# - SafeToSpendCard renders BalanceProjectionChart (components/analytics/SafeToSpendCard.tsx:135) and the FIRE
#   Monte Carlo results render MonteCarloFanChart (pages/fire-calculator/components/MonteCarloResults.tsx:67):
#   one hop further out, like the other callers.
# - Sankey internals SankeyMarks, SankeyReadout, sankeyModel, sankeyLayout: folded into the SankeyDiagram node
#   (components/charts/SankeyDiagram.tsx:93-161).
# - Treemap internals TreemapMarks, treemapLayout, treemapModel: folded into the Treemap node
#   (components/charts/Treemap.tsx:190).
# - ExpenseTreemap renders CategoryTreemap (components/analytics/ExpenseTreemap.tsx:21) and ComparisonPage renders
#   CategorySlopeChart (pages/comparison/ComparisonPage.tsx:216): named in notes, one hop further out.
# - Grid's TickLayer, used by Axis (components/charts/Axis.tsx:15): folded into the CartesianChart children node.
# - Shared helpers scales.ts, paths.ts, chartContext.ts, useElementSize.ts, usePrinting.ts: imported by most kit
#   files, so no node and no arrows (loop.md rung 1); named in the CartesianChart and ChartFrame notes
#   (components/charts/CartesianChart.tsx:130, components/charts/ChartFrame.tsx:59-62).
# - Per-file animation use: every mark calls chartTransition or CHART_MOTION and draws motion elements
#   (Bars.tsx:79-88, PieChart.tsx:174-188, SankeyDiagram.tsx:27, ChartBrush.tsx:198, TreemapMarks.tsx:110,
#   SlopeChart.tsx:121-136) and ChartFrame calls useInView (ChartFrame.tsx:61); drawn as one kit -> Motion 14 arrow. The chartMotion tokens
#   (components/charts/chartMotion.ts:9) are folded into the Motion 14 node note.
# - Folded nodes: StandardBarChart (used by MonthlyFlowChart), StandardAreaChart and TimeSeriesLineChart are one
#   "Standard x/y wrappers" node (StandardBarChart.tsx:110, StandardAreaChart.tsx:84, TimeSeriesLineChart.tsx:41);
#   Bars, LineSeries, AreaSeries, Axis, Grid, References, CartesianTooltip and Crosshair are one
#   "CartesianChart children" node (Bars.tsx:71, LineSeries.tsx:46, AreaSeries.tsx:25, Axis.tsx:68, Grid.tsx:33,
#   References.tsx:63, CartesianTooltip.tsx:65, Crosshair.tsx:24).
# - Custom children and overlays written by consumers: PieCenterReadout, ValueSortedTooltip, NetWorthTooltip,
#   ProjectionReveal (they read chartContext like the kit's own children).
# - Sparkline, ProgressBar, CircularProgress: reuse chartMotion and usePrinting without ChartFrame, so they are
#   not part of the kit's composition (components/shared/Sparkline.tsx:5, components/shared/ProgressBar.tsx:4).
# - useChartRange (components/ui) behind ChartBrush, and the stores ChartFrame reads (motionStore, themeStore,
#   useIsMobile): app state, not chart parts.
# - Tests under __tests__.
# standIns: Motion 14 drawn with tabler:brand-framer-motion (Motion is the renamed Framer Motion; its own
#   logo is not in the icon catalog).
title: "Chart kit: components/charts and who renders it"
subtitle: In-house animated SVG charts that replaced Recharts; every chart root draws inside ChartFrame and animates with Motion 14
direction: right
layout: { spacing: 0.5 }

groups:
  wrappers:
    type: zone
    label: Analytics wrappers (components/analytics)
    evidence: frontend/src/components/analytics
  pages:
    type: zone
    label: Page charts (pages/*)
    evidence: frontend/src/pages
  kit:
    type: zone
    label: Chart kit (components/charts)
    evidence: frontend/src/components/charts

nodes:
  # Wrappers in components/analytics, in the order their arrows enter the kit.
  cat-treemap:
    icon: tabler:chart-treemap
    label: CategoryTreemap
    note: used by ExpenseTreemap
    in: wrappers
    evidence:
      - "frontend/src/components/analytics/CategoryTreemap.tsx:43#CategoryTreemap"
      - "frontend/src/components/analytics/ExpenseTreemap.tsx:21#CategoryTreemap"
  std-radar:
    icon: tabler:chart-radar
    label: StandardRadarChart
    note: health score
    in: wrappers
    evidence: "frontend/src/components/analytics/StandardRadarChart.tsx:35#StandardRadarChart"
  bespoke:
    icon: tabler:chart-histogram
    label: Bespoke analytics charts
    badge: x4
    note: Pareto, effective tax rate, cash flow forecast, balance projection
    in: wrappers
    evidence:
      - "frontend/src/components/analytics/ParetoChart.tsx:81#ParetoChart"
      - "frontend/src/components/analytics/EffectiveTaxRateChart.tsx:54#EffectiveTaxRateChart"
      - "frontend/src/components/analytics/CashFlowForecastChart.tsx:86#CashFlowForecastChart"
      - "frontend/src/components/analytics/BalanceProjectionChart.tsx:54#BalanceProjectionChart"
  std-xy:
    icon: tabler:chart-line
    label: Standard x/y wrappers
    badge: x3
    note: bar, area, time-series line
    in: wrappers
    evidence:
      - "frontend/src/components/analytics/StandardBarChart.tsx:111#StandardBarChart"
      - "frontend/src/components/analytics/StandardAreaChart.tsx:89#StandardAreaChart"
      - "frontend/src/components/analytics/TimeSeriesLineChart.tsx:44#TimeSeriesLineChart"
  std-pie:
    icon: tabler:chart-pie
    label: StandardPieChart
    in: wrappers
    evidence: "frontend/src/components/analytics/StandardPieChart.tsx:70#StandardPieChart"

  # Pages that compose the kit directly.
  page-xy:
    icon: tabler:app-window
    label: Page x/y charts
    badge: x14
    note: net worth, returns, trends, tax, GST, FIRE, year in review
    in: pages
    evidence:
      - "frontend/src/pages/net-worth/components/NetWorthAreaPlot.tsx:83#CartesianChart"
      - "frontend/src/pages/returns-analysis/components/ReturnsMonthlyChart.tsx:140#CartesianChart"
      - "frontend/src/pages/investment-analytics/components/GrowthOverTimeChart.tsx:121#CartesianChart"
      - "frontend/src/pages/trends-forecasts/components/MonthlyTrendPanel.tsx:118#CartesianChart"
      - "frontend/src/pages/trends-forecasts/components/SavingsRateSection.tsx:114#CartesianChart"
      - "frontend/src/pages/income-analysis/components/IncomeTrendSection.tsx:113#CartesianChart"
      - "frontend/src/pages/spending-analysis/components/ExpenseTrendSection.tsx:122#CartesianChart"
      - "frontend/src/pages/tax-planning/components/TaxYearChart.tsx:105#CartesianChart"
      - "frontend/src/pages/tax-planning/components/TdsScheduleChart.tsx:103#CartesianChart"
      - "frontend/src/pages/gst-analysis/components/GSTCharts.tsx:66#CartesianChart"
      - "frontend/src/pages/comparison/components/SpendingButterflyChart.tsx:69#CartesianChart"
      - "frontend/src/pages/year-in-review/components/MonthlyBreakdownChart.tsx:68#CartesianChart"
      - "frontend/src/pages/mutual-fund-projection/components/GrowthPlot.tsx:91#CartesianChart"
      - "frontend/src/pages/fire-calculator/components/MonteCarloFanChart.tsx:52#CartesianChart"
  page-pie:
    icon: tabler:app-window
    label: Page pies
    badge: x2
    note: GST rate mix, budget rule
    in: pages
    evidence:
      - "frontend/src/pages/gst-analysis/components/GSTRateMix.tsx:61#PieChart"
      - "frontend/src/pages/spending-analysis/components/BudgetRuleAnalysis.tsx:123#PieChart"
  page-sankey:
    icon: tabler:app-window
    label: Cash Flow page
    note: FlowDiagramPanel
    in: pages
    evidence: "frontend/src/pages/income-expense-flow/components/FlowDiagramPanel.tsx:57#SankeyDiagram"

  page-slope:
    icon: tabler:app-window
    label: Comparison page
    note: CategorySlopeChart
    in: pages
    evidence:
      - "frontend/src/pages/comparison/components/CategorySlopeChart.tsx:51#SlopeChart"
      - "frontend/src/pages/comparison/ComparisonPage.tsx:216#CategorySlopeChart"

  # The kit: chart roots, in the order the wrappers and pages above enter them, then ChartFrame.
  # CartesianChart children share the roots' column (align) right under CartesianChart, so their
  # one arrow stays out of the arrows into ChartFrame.
  treemap:
    icon: tabler:chart-treemap
    label: Treemap
    note: zoomable tiles
    in: kit
    evidence:
      - "frontend/src/components/charts/Treemap.tsx:39#Treemap"
      - "frontend/src/components/charts/Treemap.tsx:187#ChartFrame"
  radar:
    icon: tabler:radar-2
    label: RadarChart
    in: kit
    evidence: "frontend/src/components/charts/RadarChart.tsx:60#RadarChart"
  cartesian:
    icon: tabler:chart-dots
    label: CartesianChart
    note: scales, context, active row, pointer
    in: kit
    evidence: "frontend/src/components/charts/CartesianChart.tsx:62#CartesianChart"
  children:
    icon: tabler:chart-area-line
    label: CartesianChart children
    note: marks, axes, references, tooltip
    in: kit
    align: cartesian
    evidence:
      - "frontend/src/components/charts/CartesianChart.tsx:137#CartesianContext"
      - "frontend/src/components/charts/Bars.tsx:71#Bars"
      - "frontend/src/components/charts/LineSeries.tsx:48#LineSeries"
      - "frontend/src/components/charts/AreaSeries.tsx:27#AreaSeries"
      - "frontend/src/components/charts/Axis.tsx:68#CategoryAxis"
      - "frontend/src/components/charts/Axis.tsx:100#ValueAxis"
      - "frontend/src/components/charts/Grid.tsx:33#Grid"
      - "frontend/src/components/charts/References.tsx:63#ReferenceLine"
      - "frontend/src/components/charts/References.tsx:113#ReferenceArea"
      - "frontend/src/components/charts/References.tsx:143#ReferenceDot"
      - "frontend/src/components/charts/CartesianTooltip.tsx:65#CartesianTooltip"
      - "frontend/src/components/charts/Crosshair.tsx:24#Crosshair"
  brush:
    icon: tabler:adjustments-horizontal
    label: ChartBrush
    note: zoom range
    in: kit
    evidence: "frontend/src/components/charts/ChartBrush.tsx:59#ChartBrush"
  pie:
    icon: tabler:chart-pie-2
    label: PieChart
    in: kit
    evidence: "frontend/src/components/charts/PieChart.tsx:61#PieChart"
  sankey:
    icon: tabler:chart-sankey
    label: SankeyDiagram
    note: marks, readout, layout model
    in: kit
    evidence: "frontend/src/components/charts/SankeyDiagram.tsx:57#SankeyDiagram"
  slope:
    icon: tabler:trending-up
    label: SlopeChart
    in: kit
    evidence:
      - "frontend/src/components/charts/SlopeChart.tsx:57#SlopeChart"
      - "frontend/src/components/charts/SlopeChart.tsx:81#ChartFrame"
  frame:
    icon: tabler:frame
    label: ChartFrame
    note: size, in-view entrance, print, a11y
    in: kit
    evidence: "frontend/src/components/charts/ChartFrame.tsx:43#ChartFrame"

  # Animation engine, outside the kit (npm package).
  motion:
    icon: tabler:brand-framer-motion
    label: Motion 14
    note: with chartMotion tokens
    evidence:
      - "frontend/package.json:27#motion"
      - "frontend/src/components/charts/chartMotion.ts:9#CHART_MOTION"

edges:
  # Wrappers render the roots.
  - { from: std-radar, to: radar, label: renders, evidence: "frontend/src/components/analytics/StandardRadarChart.tsx:58#RadarChart" }
  - from: bespoke
    to: cartesian
    label: renders
    evidence:
      - "frontend/src/components/analytics/ParetoChart.tsx:139#CartesianChart"
      - "frontend/src/components/analytics/EffectiveTaxRateChart.tsx:137#CartesianChart"
      - "frontend/src/components/analytics/CashFlowForecastChart.tsx:97#CartesianChart"
      - "frontend/src/components/analytics/BalanceProjectionChart.tsx:116#CartesianChart"
  - from: std-xy
    to: cartesian
    label: renders
    evidence:
      - "frontend/src/components/analytics/StandardBarChart.tsx:177#CartesianChart"
      - "frontend/src/components/analytics/StandardAreaChart.tsx:172#CartesianChart"
      - "frontend/src/components/analytics/TimeSeriesLineChart.tsx:115#CartesianChart"
  - from: std-xy
    to: brush
    label: zoom
    evidence:
      - "frontend/src/components/analytics/StandardBarChart.tsx:224#ChartBrush"
      - "frontend/src/components/analytics/StandardAreaChart.tsx:221#ChartBrush"
      - "frontend/src/components/analytics/TimeSeriesLineChart.tsx:133#ChartBrush"
  - { from: std-pie, to: pie, label: renders, evidence: "frontend/src/components/analytics/StandardPieChart.tsx:115#PieChart" }

  - { from: cat-treemap, to: treemap, label: renders, evidence: "frontend/src/components/analytics/CategoryTreemap.tsx:103#Treemap" }

  # Pages render the roots directly.
  - from: page-xy
    to: cartesian
    label: renders
    evidence: "frontend/src/pages/net-worth/components/NetWorthAreaPlot.tsx:83#CartesianChart"
  - from: page-xy
    to: brush
    label: zoom
    evidence:
      - "frontend/src/pages/net-worth/components/NetWorthAreaPlot.tsx:167#ChartBrush"
      - "frontend/src/pages/returns-analysis/components/ReturnsMonthlyChart.tsx:177#ChartBrush"
      - "frontend/src/pages/investment-analytics/components/GrowthOverTimeChart.tsx:155#ChartBrush"
      - "frontend/src/pages/income-analysis/components/IncomeTrendSection.tsx:138#ChartBrush"
      - "frontend/src/pages/spending-analysis/components/ExpenseTrendSection.tsx:147#ChartBrush"
      - "frontend/src/pages/trends-forecasts/components/MonthlyTrendSection.tsx:112#ChartBrush"
      - "frontend/src/pages/trends-forecasts/components/SavingsRateSection.tsx:139#ChartBrush"
  - { from: page-sankey, to: sankey, label: renders, evidence: "frontend/src/pages/income-expense-flow/components/FlowDiagramPanel.tsx:57#SankeyDiagram" }
  - { from: page-slope, to: slope, label: renders, evidence: "frontend/src/pages/comparison/components/CategorySlopeChart.tsx:51#SlopeChart" }
  - { from: page-pie, to: pie, label: renders, evidence: "frontend/src/pages/gst-analysis/components/GSTRateMix.tsx:61#PieChart" }

  # Inside the kit.
  - { from: radar, to: frame, evidence: "frontend/src/components/charts/RadarChart.tsx:74#ChartFrame" }
  - { from: cartesian, to: frame, label: wraps in, evidence: "frontend/src/components/charts/CartesianChart.tsx:82#ChartFrame" }
  - from: cartesian
    to: children
    label: scales via context
    evidence: "frontend/src/components/charts/CartesianChart.tsx:137#CartesianContext"
  - { from: pie, to: frame, evidence: "frontend/src/components/charts/PieChart.tsx:95#ChartFrame" }
  - { from: treemap, to: frame, evidence: "frontend/src/components/charts/Treemap.tsx:187#ChartFrame" }
  - { from: sankey, to: frame, evidence: "frontend/src/components/charts/SankeyDiagram.tsx:93#ChartFrame" }
  - { from: slope, to: frame, evidence: "frontend/src/components/charts/SlopeChart.tsx:81#ChartFrame" }

  # Animation: every mark calls the chartMotion tokens and draws motion elements; ChartFrame calls useInView.
  - from: kit
    to: motion
    label: animates with
    evidence:
      - "frontend/src/components/charts/Bars.tsx:80#chartTransition"
      - "frontend/src/components/charts/Bars.tsx:89#motion"
      - "frontend/src/components/charts/PieChart.tsx:175#chartTransition"
      - "frontend/src/components/charts/SankeyDiagram.tsx:27#CHART_MOTION"
      - "frontend/src/components/charts/ChartBrush.tsx:198#chartTransition"
      - "frontend/src/components/charts/TreemapMarks.tsx:110#chartTransition"
      - "frontend/src/components/charts/SlopeChart.tsx:121#chartTransition"
      - "frontend/src/components/charts/ChartFrame.tsx:61#useInView"
