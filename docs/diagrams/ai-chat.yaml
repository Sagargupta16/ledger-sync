# yaml-language-server: $schema=https://raw.githubusercontent.com/Sagargupta16/orrery/main/skills/orrery/references/diagram.schema.json
# Figure ai-chat from .claude/orrery/plan.json; every edge is inferred from call sites.
# Left out on purpose: AI config CRUD and key encryption, the GET /api/ai/tools manifest load,
# rate limits, 503/400 setup errors and nonbillable release detail, stop-and-clear cancellation.
title: "AI chat: funding modes, quota reservation and the tool loop"
subtitle: Amazon Bedrock runs through the backend under a reserved quota, OpenAI and Anthropic run from the browser, and the tool loop stops after 6 model calls
kind: flowchart
direction: down
layout: { spacing: normal }
legend: { dashed: "Side call, not awaited" }

groups:
  lane-browser: { type: lane, label: Browser (useChat), evidence: "frontend/src/components/chat/useChat.ts:110-362" }
  lane-backend: { type: lane, label: Backend (FastAPI), evidence: "backend/src/ledger_sync/api/ai_chat.py:60" }
  lane-model:
    type: lane
    label: Model providers
    evidence: ["frontend/src/lib/chatAdapters.ts:249-250", "backend/src/ledger_sync/api/ai_chat_bedrock.py:233"]

nodes:
  send:
    shape: terminator
    label: User sends message
    in: lane-browser
    evidence: "frontend/src/components/chat/useChat.ts:137-158"
  mode:
    shape: decision
    label: Mode and provider?
    in: lane-browser
    evidence: "frontend/src/components/chat/useChat.ts:86-108"   # resolveCredentials
  getkey:
    shape: data
    label: GET stored API key
    in: lane-browser
    evidence: ["frontend/src/services/api/aiConfig.ts:38-39", "backend/src/ledger_sync/api/preferences_ai.py:235-279"]
  context:
    shape: process
    label: Build system prompt
    note: preferences only
    in: lane-browser
    evidence: "frontend/src/components/chat/useChat.ts:163-167"   # built once per send, cached 5 minutes (:164)
  # Each round calls sendChat, which dispatches on the provider; the next round comes back here,
  # not to the prompt step (useChat.ts:275, :338).
  dispatch:
    shape: decision
    label: Provider?
    in: lane-browser
    evidence: ["frontend/src/lib/chatAdapters.ts:485-494", "frontend/src/components/chat/useChat.ts:296"]
  proxy:
    shape: data
    label: POST /api/ai/bedrock/chat
    in: lane-browser
    evidence: "frontend/src/lib/chatAdapters.ts:451"
  funding:
    shape: process
    label: Pick funding
    note: personal bearer or app model
    in: lane-backend
    evidence: "backend/src/ledger_sync/api/ai_chat.py:88-104"
  reserve:
    shape: decision
    label: Within quota?
    note: reserve under user lock
    in: lane-backend
    evidence: ["backend/src/ledger_sync/api/ai_chat.py:120-126", "backend/src/ledger_sync/api/ai_usage.py:153-243"]
  bedrock:
    icon: aws:bedrock
    label: Bedrock Converse
    in: lane-model
    evidence: "backend/src/ledger_sync/api/ai_chat_bedrock.py:208-233"
  settle:
    shape: process
    label: Settle or release
    in: lane-backend
    evidence: ["backend/src/ledger_sync/api/ai_chat.py:127-151", "backend/src/ledger_sync/api/ai_usage.py:265-305"]
  direct:
    shape: process
    label: OpenAI or Anthropic
    note: browser-direct
    in: lane-model
    evidence: ["frontend/src/lib/chatAdapters.ts:289", "frontend/src/lib/chatAdapters.ts:381"]
  uselog:
    shape: data
    label: POST /api/ai/usage/log
    note: best-effort, not awaited
    in: lane-browser
    evidence: ["frontend/src/components/chat/useChat.ts:311-325", "backend/src/ledger_sync/api/ai_usage.py:306"]   # promise not awaited, .catch only
    align: proxy
  tooluse:
    shape: decision
    label: tool_use?
    in: lane-browser
    evidence: "frontend/src/components/chat/useChat.ts:334-337"   # tests stopReason only
  # Plan lane was lane-backend; drawn as the browser's call (like proxy and uselog) so the
  # 6-round loop stays in one lane (7 crossings -> 2). The note keeps the backend execution.
  tools:
    shape: predefined
    label: POST /api/ai/tools/execute
    note: parallel, run user-scoped on the backend
    in: lane-browser
    evidence: ["frontend/src/components/chat/useChat.ts:344-359", "frontend/src/lib/chatTools.ts:40", "backend/src/ledger_sync/api/ai_tools.py:56-98"]
  # The limit is checked at the start of the next round, after the tools ran (useChat.ts:273, :338).
  rounds:
    shape: decision
    label: Rounds left?
    note: max 6 model calls
    in: lane-browser
    evidence: ["frontend/src/components/chat/useChat.ts:294", "frontend/src/components/chat/useChat.ts:361", "frontend/src/components/chat/useChat.ts:14"]
  answer:
    shape: terminator
    label: Show final answer
    in: lane-browser
    evidence: "frontend/src/components/chat/useChat.ts:334-336"
  capped:
    shape: terminator
    label: Stop after 6 rounds
    in: lane-browser
    evidence: ["frontend/src/components/chat/useChat.ts:14", "frontend/src/components/chat/useChat.ts:274-284"]   # MAX_TOOL_ROUNDS
  quota:
    shape: terminator
    label: 429 quota exhausted
    in: lane-browser
    evidence: ["backend/src/ledger_sync/api/ai_usage.py:163", "backend/src/ledger_sync/api/ai_usage.py:217"]

edges:
  - { from: send, to: mode, evidence: "frontend/src/components/chat/useChat.ts:161" }
  - { from: mode, to: context, label: any Bedrock mode, evidence: "frontend/src/components/chat/useChat.ts:92-105" }
  - { from: mode, to: getkey, label: BYOK OpenAI or Anthropic, evidence: "frontend/src/components/chat/useChat.ts:103-106" }
  - { from: getkey, to: context, evidence: "frontend/src/components/chat/useChat.ts:161-167" }
  - { from: context, to: dispatch, evidence: "frontend/src/components/chat/useChat.ts:170-178" }
  - { from: dispatch, to: proxy, label: Bedrock, evidence: ["frontend/src/lib/chatAdapters.ts:451", "frontend/src/lib/chatAdapters.ts:488"] }
  - { from: dispatch, to: direct, label: OpenAI or Anthropic, evidence: ["frontend/src/lib/chatAdapters.ts:486-487", "frontend/src/lib/chatAdapters.ts:289", "frontend/src/lib/chatAdapters.ts:381"] }
  - { from: proxy, to: funding, label: JWT, evidence: "backend/src/ledger_sync/api/ai_chat.py:77-94" }
  - { from: funding, to: reserve, evidence: "backend/src/ledger_sync/api/ai_chat.py:106-126" }
  - { from: reserve, to: quota, label: "no", evidence: ["backend/src/ledger_sync/api/ai_usage.py:153-163", "backend/src/ledger_sync/api/ai_usage.py:217"] }
  - { from: reserve, to: bedrock, label: "yes, reserved", evidence: "backend/src/ledger_sync/api/ai_chat.py:127-128#_call_bedrock" }
  - { from: bedrock, to: settle, label: usage counters, evidence: "backend/src/ledger_sync/api/ai_chat.py:136-151" }
  - { from: settle, to: tooluse, label: content blocks, evidence: ["backend/src/ledger_sync/api/ai_chat.py:152-157", "frontend/src/components/chat/useChat.ts:328-334"] }
  - { from: direct, to: tooluse, label: content blocks, evidence: "frontend/src/components/chat/useChat.ts:328-334" }
  - { from: direct, to: uselog, label: provider usage, line: dashed, evidence: "frontend/src/components/chat/useChat.ts:311-325" }   # side call, not awaited
  - { from: tooluse, to: answer, label: end_turn, evidence: "frontend/src/components/chat/useChat.ts:334-336" }
  - { from: tooluse, to: tools, label: tool_use, evidence: "frontend/src/components/chat/useChat.ts:339-351#executeTool" }
  - { from: tools, to: rounds, evidence: "frontend/src/components/chat/useChat.ts:352-361" }
  - { from: rounds, to: dispatch, label: "yes, add tool_result", evidence: ["frontend/src/components/chat/useChat.ts:352-361", "frontend/src/components/chat/useChat.ts:296"] }
  - { from: rounds, to: capped, label: "no, 6 used", evidence: ["frontend/src/components/chat/useChat.ts:294", "frontend/src/components/chat/useChat.ts:274-284"] }
