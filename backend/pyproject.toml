[project]
name = "ledger-sync"
version = "2.30.1"
description = "Personal finance dashboard backend -- Excel import, financial analytics, multi-currency exchange rates"
authors = [{ name = "Sagar Gupta" }]
readme = "README.md"
# One minor version: Vercel picks the newest Python this allows (it ran 3.14
# while CI tested 3.13). Move CI, migrate.yml and this pin together.
requires-python = ">=3.14,<3.15"
dependencies = [
    # <2.1: SQLAlchemy 2.1.1's order_by typing fails mypy (18 arg-type errors, 2026-09-29).
    "sqlalchemy>=2.0.51,<2.1",
    "alembic>=1.18.4",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "typer>=0.21.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.2.0",
    "rich>=14.0.0",
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "PyJWT>=2.12.0",
    "psycopg[binary]>=3.3.4",
    "slowapi>=0.1.10",
    "httpx>=0.28.0",
    "cryptography>=50.0.0",
    "boto3>=1.43.0",
]

[project.scripts]
ledger-sync = "ledger_sync.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "mypy>=2.1.0",
    "pandas-stubs>=2.2.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = true
# Transitive-dep CVE overrides:
#   pygments >=2.20.0      -- CVE-2026-4539
#   python-dotenv >=1.2.2  -- CVE-2026-28684
#   mako >=1.3.12          -- CVE-2026-44307
#   urllib3 >=2.7.0        -- CVE-2026-44431, CVE-2026-44432
#   starlette >=1.3.1      -- CVE-2026-48710/48817/48818/54282/54283 (FastAPI allows >=0.46)
#   idna >=3.18            -- CVE-2026-45409
#   certifi >=2026.10.19   -- GHSA-6q48-6c7w-9gw2 (emSign roots with compromised intermediate keys; via httpx)
# Keep only packages present in uv.lock; drop a line once nothing pulls it in.
constraint-dependencies = [
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "mako>=1.3.12",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.18",
    "certifi>=2026.10.19",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# Base families (unchanged): pycodestyle, pyflakes, isort, pep8-naming, pyupgrade.
# Added families are ones the codebase is now clean against, so regressions fail CI:
#   B    flake8-bugbear         -- catches raise-without-from (traceback loss), bad zip()
#   S    flake8-bandit          -- security; hardcoded-secret and SQL-injection signal
#   DTZ  flake8-datetimez       -- naive datetimes; a known recurring bug class here
#                                  (FY is Apr-Mar and users are IST, so a UTC-vs-IST
#                                  month/FY boundary slip is a real reporting defect)
#   C4   flake8-comprehensions  ICN  import conventions
#   PTH  flake8-use-pathlib     ISC  implicit str concat
#   LOG  flake8-logging         PIE  misc lints
#   TID  tidy imports           FA   future annotations
#   INP  no implicit namespace  T20  no print/pprint
#   Q    quotes                 SLOT __slots__
#   YTT  sys.version checks     PYI  stub conventions
#   RUF  ruff-specific          RET/SIM/TRY/EM/ARG/A/BLE/PERF/FBT/SLF are deliberately
#                               NOT selected -- see the notes below.
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "S",
    "DTZ",
    "C4",
    "PTH",
    "LOG",
    "ISC",
    "PIE",
    "TID",
    "FA",
    "ICN",
    "INP",
    "T20",
    "Q",
    "SLOT",
    "YTT",
    "PYI",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# S101 -- pytest's bare assert is the whole point of a test file.
"tests/**/*.py" = ["S101"]
# DTZ001: this suite tests the IST ledger clock, so NAIVE datetimes are the
# expected values under test, not an oversight. Adding tzinfo to the assertions
# would test the opposite of the contract (ledger_now returns naive IST so it
# compares cleanly against the naive Transaction.date column).
"tests/unit/test_ledger_clock.py" = ["S101", "DTZ001"]
# Same reason: these assert the naive IST bounds that _get_time_range_dates
# returns, so the expected values must be naive.
"tests/integration/test_time_range_anchor_now.py" = ["S101", "DTZ001"]
# The only test-tree hardcoded-secret findings are in this one file: throwaway
# `password = "test-password-123"` literals and `token_type="access"` kwargs.
# Audited 2026-07-26, no real credential. Kept file-scoped on purpose so a
# genuine hardcoded key added to any OTHER test fixture still fails CI.
"tests/unit/test_auth.py" = ["S105", "S106"]
# Migration SQL is static DDL built from module-level constants and hardcoded
# table lists, never from user input. The remaining S608 is a multi-line
# f-string INSERT of default preference values whose diagnostic anchors to the
# opening quote line, so it cannot carry an inline noqa without landing the
# comment inside the SQL string itself.
"**/migrations/**/*.py" = ["S608"]
# token_type="access" / "refresh" are JWT type discriminators, and the OAuth
# provider token endpoints are public Google/GitHub URLs -- not credentials.
# Audited 2026-07-26: no real secret is hardcoded in src/.
"src/ledger_sync/api/deps.py" = ["S106"]
"src/ledger_sync/api/oauth.py" = ["S105"]
"src/ledger_sync/core/auth/tokens.py" = ["S107"]
"src/ledger_sync/schemas/auth.py" = ["S105"]
"src/ledger_sync/services/auth_service.py" = ["S106"]
# typer.Argument()/Option() in parameter defaults IS the typer API. B008 cannot
# be satisfied here without abandoning the framework's declarative style.
"src/ledger_sync/cli/**/*.py" = ["B008"]
# DTZ001: normalizer.normalize_date() intentionally produces naive wall-clock
# datetimes to match the naive DateTime columns; IST anchoring belongs to the
# callers (core/ledger_clock.py), not the parser.
"src/ledger_sync/ingest/normalizer.py" = ["DTZ001"]
# INP001: Vercel resolves the serverless entrypoint by file path (api/index.py,
# routed from vercel.json). Adding api/__init__.py would make it a package and
# is not what the platform imports, so the implicit namespace is required.
"api/index.py" = ["INP001"]
# Operator-run diagnostic script, not importable library code:
#   INP001 -- scripts/ is deliberately not a package
#   T201 -- printing to the terminal is the script's entire output contract
"scripts/**/*.py" = ["INP001", "T201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ledger_sync.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_sync"]
