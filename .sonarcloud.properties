# SonarCloud automatic analysis settings (no CI scanner step exists for this repo).
#
# docs/DATABASE_MODEL_SCHEMA.sql is PostgreSQL DDL generated from the SQLAlchemy
# models as a read-only reference. SonarCloud has no PostgreSQL analyzer, so it
# parses every .sql file as Oracle PL/SQL and reports Oracle-only advice such as
# "Use VARCHAR2 instead of VARCHAR" (plsql:VarcharUsageCheck), which is invalid
# for PostgreSQL. The file is documentation, not executed code; keep it out of
# the PL/SQL analyzer instead of rewriting valid Postgres into Oracle syntax.
sonar.exclusions=docs/**/*.sql
