name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Frontend: lint -> build (tsc -b) -> test, via the shared reusable workflow.
  frontend:
    uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
    with:
      working-directory: frontend

  # Backend: real gating (ruff + mypy + pytest). The shared python-ci workflow
  # swallows failures with `|| true`, so we run an inline job that actually
  # fails the build on lint/type/test errors.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
      LEDGER_SYNC_DATABASE_URL: "sqlite:///:memory:"
      LEDGER_SYNC_ENVIRONMENT: development
      LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        # --group dev pulls ruff/mypy/pytest (declared in [dependency-groups],
        # PEP 735) -- they are not extras, so --all-extras alone misses them.
        run: uv sync --locked --no-build --no-install-project --all-extras --group dev

      # Lint the whole backend dir, matching `pnpm run lint:backend`, so CI can
      # never pass on a tree where the documented local command fails.
      - name: Ruff lint
        run: uv run --no-sync --locked --no-build ruff check .

      - name: Ruff format check
        run: uv run --no-sync --locked --no-build ruff format --check .

      - name: Mypy
        run: uv run --no-sync --locked --no-build mypy src/

      - name: Pytest
        run: uv run --no-sync --locked --no-build pytest tests/ -q

      # Keep the documented CLI bootstrap covered as well as in-process tests.
      - name: Alembic upgrade from an empty database
        env:
          LEDGER_SYNC_DATABASE_URL: sqlite:///./ci_migration_check.db
          LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: uv run --no-sync --locked --no-build alembic upgrade head

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
      LEDGER_SYNC_DATABASE_URL: "sqlite:///:memory:"
      LEDGER_SYNC_ENVIRONMENT: development
      LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
      LEDGER_SYNC_TEST_POSTGRES_URL: postgresql+psycopg://ledger_sync_test@127.0.0.1:55432/ledger_sync_test_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-build --no-install-project --all-extras --group dev
      - name: Start an isolated native PostgreSQL cluster
        shell: bash
        run: |
          pg_ctl=$(find /usr/lib/postgresql -path '*/bin/pg_ctl' -type f | sort -V | tail -n 1)
          if [ -z "$pg_ctl" ]; then
            echo "::error::The runner must provide native PostgreSQL binaries."
            exit 1
          fi
          pg_bin=$(dirname "$pg_ctl")
          pg_data="$RUNNER_TEMP/ledger-sync-postgres/data"
          mkdir -p "$pg_data"
          printf 'POSTGRES_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
          printf 'POSTGRES_TEST_DATA=%s\n' "$pg_data" >> "$GITHUB_ENV"
          "$pg_bin/initdb" -D "$pg_data" --username=ledger_sync_test --auth=trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/ledger-sync-postgres/server.log" \
            -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP/ledger-sync-postgres" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U ledger_sync_test ledger_sync_test_migrations
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U ledger_sync_test \
            -d ledger_sync_test_migrations -c "SELECT version();"
      - name: PostgreSQL migrations, constraints, rollback guards, and concurrent AI quotas
        run: uv run --no-sync --locked --no-build pytest tests/integration/test_migrations_from_scratch.py -q -k postgresql
      - name: Stop the owned native PostgreSQL cluster
        if: always()
        shell: bash
        run: |
          if [ "${POSTGRES_TEST_DATA:-}" = "$RUNNER_TEMP/ledger-sync-postgres/data" ] \
            && [ -f "$POSTGRES_TEST_DATA/postmaster.pid" ]; then
            "$POSTGRES_BIN/pg_ctl" -D "$POSTGRES_TEST_DATA" -m fast -w stop
          fi

  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend, postgres-migrations, security]
    uses: ./.github/workflows/migrate.yml
    permissions:
      contents: read
    secrets:
      LEDGER_SYNC_DATABASE_URL: ${{ secrets.LEDGER_SYNC_DATABASE_URL }}

  deploy-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: migrate
    uses: ./.github/workflows/deploy-frontend.yml
    permissions:
      contents: read
      pages: write
      id-token: write
