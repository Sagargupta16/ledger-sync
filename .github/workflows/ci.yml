name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  # Frontend: lint -> build (tsc -b) -> test, via the shared reusable workflow.
  frontend:
    uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@526859720d9ce8689f230dafbfa4e40d798b83cb # main
    permissions:
      contents: read
    with:
      working-directory: frontend
      # Match the Node major that deploy-frontend.yml ships with.
      node-version: "24"

  # The shipped artifact is a GitHub Pages build (base /ledger-sync/, installed
  # without lifecycle scripts). Build it exactly as deploy-frontend.yml does so
  # a Pages-only failure surfaces here instead of during deployment.
  frontend-pages-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # deploy-frontend.yml waits for the live backend to report this version, so a
      # missed __init__.py bump has to fail here, before migrate touches production.
      - name: Frontend and backend versions agree
        run: |
          frontend=$(node -p "require('./package.json').version")
          backend=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' ../backend/src/ledger_sync/__init__.py | tr -d '\r')
          if [ "$frontend" != "$backend" ]; then
            echo "::error::frontend/package.json is $frontend but ledger_sync.__version__ is ${backend:-missing}."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

  # Backend: real gating (ruff + mypy + pytest). The shared python-ci workflow
  # has no mypy step, so we run an inline job that fails the build on
  # lint/type/test errors.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
      LEDGER_SYNC_DATABASE_URL: "sqlite:///:memory:"
      LEDGER_SYNC_ENVIRONMENT: development
      LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        # ruff/mypy/pytest live in [dependency-groups] (PEP 735), not extras.
        # uv syncs the dev group by default; --group dev keeps that explicit.
        run: uv sync --locked --no-build --no-install-project --all-extras --group dev

      # Lint the whole backend dir, matching `pnpm run lint:backend`, so CI can
      # never pass on a tree where the documented local command fails.
      - name: Ruff lint
        run: uv run --no-sync --locked --no-build ruff check .

      - name: Ruff format check
        run: uv run --no-sync --locked --no-build ruff format --check .

      - name: Mypy
        run: uv run --no-sync --locked --no-build mypy src/

      - name: Pytest
        run: uv run --no-sync --locked --no-build pytest tests/ -q

      # Keep the documented CLI bootstrap covered as well as in-process tests.
      - name: Alembic upgrade from an empty database
        env:
          LEDGER_SYNC_DATABASE_URL: sqlite:///./ci_migration_check.db
          LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: uv run --no-sync --locked --no-build alembic upgrade head

      # Same database file: the migrated schema must match the ORM. env.py
      # filters only the documented dialect noise, so any other diff fails.
      - name: Alembic check on the migrated database
        env:
          LEDGER_SYNC_DATABASE_URL: sqlite:///./ci_migration_check.db
          LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
        run: uv run --no-sync --locked --no-build alembic check

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
      LEDGER_SYNC_DATABASE_URL: "sqlite:///:memory:"
      LEDGER_SYNC_ENVIRONMENT: development
      LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
      LEDGER_SYNC_TEST_POSTGRES_URL: postgresql+psycopg://ledger_sync_test@127.0.0.1:55432/ledger_sync_test_migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --no-build --no-install-project --all-extras --group dev
      # The semantic-search revision runs CREATE EXTENSION vector, so the cluster
      # below needs pgvector built for the same PostgreSQL major. The runner
      # image installs PostgreSQL from apt.postgresql.org and then removes that
      # repository; postgresql-common's own script adds it back.
      - name: Install pgvector for the native PostgreSQL major
        shell: bash
        run: |
          pg_ctl=$(find /usr/lib/postgresql -path '*/bin/pg_ctl' -type f | sort -V | tail -n 1)
          if [ -z "$pg_ctl" ]; then
            echo "::error::The runner must provide native PostgreSQL binaries."
            exit 1
          fi
          pg_major=$(basename "$(dirname "$(dirname "$pg_ctl")")")
          sudo sh /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Dpkg::Options::=--force-confold "postgresql-${pg_major}-pgvector"
          test -f "/usr/share/postgresql/${pg_major}/extension/vector.control"
      - name: Start an isolated native PostgreSQL cluster
        shell: bash
        run: |
          pg_ctl=$(find /usr/lib/postgresql -path '*/bin/pg_ctl' -type f | sort -V | tail -n 1)
          if [ -z "$pg_ctl" ]; then
            echo "::error::The runner must provide native PostgreSQL binaries."
            exit 1
          fi
          pg_bin=$(dirname "$pg_ctl")
          pg_data="$RUNNER_TEMP/ledger-sync-postgres/data"
          mkdir -p "$pg_data"
          printf 'POSTGRES_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
          printf 'POSTGRES_TEST_DATA=%s\n' "$pg_data" >> "$GITHUB_ENV"
          "$pg_bin/initdb" -D "$pg_data" --username=ledger_sync_test --auth=trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$pg_data" -l "$RUNNER_TEMP/ledger-sync-postgres/server.log" \
            -o "-h 127.0.0.1 -p 55432 -k $RUNNER_TEMP/ledger-sync-postgres" -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55432 -U ledger_sync_test ledger_sync_test_migrations
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U ledger_sync_test \
            -d ledger_sync_test_migrations -c "SELECT version();"
      # -k drops the SQLite-only parametrisations the backend job already runs:
      # a test id with 'sqlite' and without 'postgresql' never runs on PostgreSQL.
      - name: Integration tests with native PostgreSQL
        run: >-
          uv run --no-sync --locked --no-build pytest tests/integration/
          tests/unit/test_ai_settings_migration.py
          tests/unit/test_compensation_migration.py
          tests/unit/test_compensation_records.py -q
          -k "not sqlite or postgresql"
      # The integration step above runs `alembic check` against a freshly
      # migrated PostgreSQL schema (test_migrations_from_scratch). This covers
      # the operator CLI path the migrate job uses: settings-driven URL
      # normalized from postgresql:// to psycopg 3, and env.py's own engine.
      - name: Alembic CLI upgrade on native PostgreSQL
        env:
          LEDGER_SYNC_DATABASE_URL: postgresql://ledger_sync_test@127.0.0.1:55432/ledger_sync_test_migrations
        run: uv run --no-sync --locked --no-build alembic upgrade head
      - name: Alembic check on native PostgreSQL
        env:
          LEDGER_SYNC_DATABASE_URL: postgresql://ledger_sync_test@127.0.0.1:55432/ledger_sync_test_migrations
        run: uv run --no-sync --locked --no-build alembic check
      - name: Stop the owned native PostgreSQL cluster
        if: always()
        shell: bash
        run: |
          if [ "${POSTGRES_TEST_DATA:-}" = "$RUNNER_TEMP/ledger-sync-postgres/data" ] \
            && [ -f "$POSTGRES_TEST_DATA/postmaster.pid" ]; then
            "$POSTGRES_BIN/pg_ctl" -D "$POSTGRES_TEST_DATA" -m fast -w stop
          fi

  # Rehearse the PR's migrations on a copy-on-write Neon branch of production so
  # they meet real data shapes before merge. Not a dependency of migrate or
  # deploy, so it never blocks a release. Without the NEON_API_KEY secret (forks,
  # or before it is added) the guard turns every later step off and the job passes.
  migration-rehearsal:
    # Same-repo PRs from people only: a bot PR (Renovate, Dependabot) would run
    # new dependency code with the Neon key and a copy of production data.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: src
      LEDGER_SYNC_ENVIRONMENT: development
      LEDGER_SYNC_JWT_SECRET_KEY: ci-secret-key-at-least-32-characters-long
    steps:
      - name: Guard on the Neon secret
        id: guard
        # Runs before checkout, so the job default `backend` does not exist yet.
        working-directory: .
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$NEON_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "NEON_API_KEY or NEON_PROJECT_ID is not set; skipping the migration rehearsal."
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: steps.guard.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: uv sync --locked --no-build --no-install-project --all-extras --group dev

      # No parent_branch: the branch is cut from the project's default (production) branch.
      - name: Create Neon branch from production
        id: neon
        if: steps.guard.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}

      # The action's db_url and password outputs are not marked secret, and a
      # step prints its env block before it runs, so the URL never crosses steps:
      # this step asks the Neon API for it with the (masked) key and masks it
      # before anything else runs. Direct (non-pooled) URI: DDL needs a session.
      - name: Alembic upgrade and check on the Neon branch
        if: steps.guard.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          NEON_ROLE: ${{ vars.NEON_ROLE_NAME || 'neondb_owner' }}
        run: |
          set -euo pipefail
          uri=$(curl -sS --fail -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/connection_uri?branch_id=$NEON_BRANCH_ID&database_name=$NEON_DATABASE&role_name=$NEON_ROLE&pooled=false" \
            | jq -r .uri)
          echo "::add-mask::$uri"
          LEDGER_SYNC_DATABASE_URL="$uri" uv run --no-sync --locked --no-build alembic upgrade head
          LEDGER_SYNC_DATABASE_URL="$uri" uv run --no-sync --locked --no-build alembic check

      # Free plan allows 10 branches per project: always delete.
      - name: Delete Neon branch
        if: always() && steps.guard.outputs.enabled == 'true' && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}

  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@526859720d9ce8689f230dafbfa4e40d798b83cb # main
    permissions:
      contents: read
      security-events: write

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, frontend-pages-build, backend, postgres-migrations, security]
    uses: ./.github/workflows/migrate.yml
    permissions:
      contents: read
    secrets:
      LEDGER_SYNC_DATABASE_URL: ${{ secrets.LEDGER_SYNC_DATABASE_URL }}

  deploy-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: migrate
    uses: ./.github/workflows/deploy-frontend.yml
    permissions:
      contents: read
      pages: write
      id-token: write
