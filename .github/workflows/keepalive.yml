name: keepalive

# Checks both backend and database connectivity every 30 minutes. Neon can
# still suspend between checks; this is not a guarantee of a warm instance.

on:
  schedule:
    # Every 30 minutes. GitHub trims at-most-once-every-five-minutes anyway,
    # so this is a polite cadence.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check backend database connectivity
        run: |
          if ! curl --fail --silent --show-error --output /dev/null \
            --max-time 30 --retry 2 --retry-all-errors --retry-delay 5 \
            "https://ledger-sync-api.vercel.app/health/db"; then
            echo "::error::Backend database health failed after three attempts. Check the release and Neon connectivity."
            exit 1
          fi
