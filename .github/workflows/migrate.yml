name: Run Database Migrations

on:
  workflow_call:
    secrets:
      LEDGER_SYNC_DATABASE_URL:
        required: true

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-build --no-install-project --no-group dev

      - name: Run Alembic migrations
        working-directory: backend
        env:
          LEDGER_SYNC_DATABASE_URL: ${{ secrets.LEDGER_SYNC_DATABASE_URL }}
          PYTHONPATH: src
        run: |
          if [ -z "$LEDGER_SYNC_DATABASE_URL" ]; then
            echo "::error::The production migration database URL is not configured."
            exit 1
          fi
          uv run --no-sync --locked --no-build alembic upgrade head
